<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Pikmin東京進香團</title>
  
  <!-- Tailwind CSS & Leaflet CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Google Fonts: Inter & Noto Sans TC */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    
    :root {
      --bg: #f5f8f6;
      --ink: #111827;
      --muted: #4b5563;
      --panel: #ffffff;
      --line: #e5e7eb;
      --green: #10b981;
      --green-dark: #065f46;
      --gold: #f59e0b;
      --blue: #3b82f6;
      --indigo: #6366f1;
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: var(--bg);
      color: var(--ink);
    }

    /* Leaflet 地圖樣式優化 */
    #map {
      background-color: #cbd5e1;
      width: 100%;
      height: 100%;
    }

    /* 漸變流光虛線路徑動畫效果 */
    .leaflet-interactive {
      stroke-dasharray: 8, 12;
      animation: dash 35s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }

    /* 定位點雷達呼吸特效 */
    .user-marker-pulse {
      width: 14px;
      height: 14px;
      background: var(--blue);
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 10px rgba(59, 130, 246, 0.4);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0px rgba(59, 130, 246, 0); }
    }

    /* 自訂捲軸樣式 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- 頂部導覽列 -->

        <img src="./assets/圖片/Screenshots/螢幕擷取畫面 2026-06-04 204124.png" alt="Pikmin" class="w-full h-full object-cover object-bottom" onerror="this.onerror=null; this.src='https://placehold.co/64x40/dffad8/065f46?text=Pikmin';" />
      </div>
      <div>
        <h1 class="text-lg md:text-xl font-black text-gray-900 tracking-tight flex items-center gap-1.5">
          Pikmin東京進香團
        </h1>
        <p class="text-[11px] text-gray-500 font-medium">精密時間軸與行動順序地圖對接系統</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1 text-xs font-bold bg-gray-50 text-emerald-700 px-3 py-1.5 rounded-full border border-gray-100" id="locationStatus">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        地圖定位啟用中
      </span>
    </div>
  </header>

  <!-- 日期導航切換鈕 -->

      <!-- 由 JS 動態繪製與切換 -->
    </div>
  </nav>

  <!-- 主內容版面：在手機版為自動高度 (h-auto) 以防地圖被裁切；電腦版維持滿版溢出隱藏 -->

    <!-- 左側邊欄：景點與行程卡片清單（手機版排在下方，電腦版排在左側） -->
    <aside class="col-span-1 lg:col-span-4 bg-white border-r border-gray-100 flex flex-col h-auto lg:h-full lg:overflow-y-auto overflow-x-hidden order-2 lg:order-1">
      
      <!-- 今日大看板 -->
      <div class="p-5 bg-gradient-to-br from-emerald-600 via-emerald-700 to-teal-800 text-white shadow-md relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/5 rounded-full blur-xl"></div>
        <span class="text-[10px] font-extrabold uppercase tracking-widest text-emerald-200/90 bg-emerald-800/60 px-2.5 py-1 rounded-md">TODAY'S PLAN</span>
        <h2 class="text-2xl font-extrabold mt-2.5 mb-1 text-white drop-shadow-sm" id="dayTitle">載入中...</h2>
        <p class="text-xs text-emerald-100/95 font-medium leading-relaxed" id="dayMeta"></p>
      </div>

      <!-- 地圖路線導航主控台 -->
      <div class="p-4 border-b border-gray-50 bg-gray-50/50">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xs font-extrabold text-gray-400 tracking-wider uppercase">路線功能</h3>
          <button id="locateBtn" class="p-2 bg-white border border-gray-200 text-gray-700 hover:text-emerald-600 rounded-lg hover:shadow-sm transition-all text-xs flex items-center gap-1.5 font-bold" title="重新定位">
            <span>⌖</span> 重定位
          </button>
        </div>

        <div class="space-y-2.5">
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">🔍</span>

          </div>

          <div class="flex flex-wrap gap-1.5" id="categoryFilters"></div>
        </div>

          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-extrabold text-amber-800 flex items-center gap-1">🍽️ 鎌倉四大風格午餐推薦</span>

        </div>

            <span>🗺️</span> 依序導航路線

        </div>
      </div>

      <div class="flex-1 relative w-full h-full">
        <div id="map"></div>

        <div class="absolute bottom-4 left-4 z-[1000] bg-white/95 backdrop-blur-md px-4 py-3 rounded-2xl shadow-xl border border-gray-100 max-w-[calc(100%-32px)]">

          </div>
          <p class="text-[10px] text-gray-500 leading-normal">

          </p>
        </div>
      </div>

    </main>
  </div>

    </div>
  </footer>

          { time: "20:30 ~", spot: "歸返新宿", note: "從上野搭乘 JR 山手線或地鐵大江戶線回到新宿王子大飯店。" }

        "day-0629": [

          { time: "09:15 - 11:00", spot: "遊就館", note: "必看：零式戰鬥機、泰緬鐵道蒸氣火車。展出大量珍貴近代歷史與軍事文化展品。" },
          { time: "11:15 - 11:45", spot: "東京大神宮", note: "必去本殿、抽各式精緻御守。以祈求姻緣與好人際關係靈驗著稱。" },
          { time: "11:45 - 12:30", spot: "午餐與前往新宿", note: "建議在飯田橋附近快速午餐，隨後趕往新宿站攜帶大件行李。" },
          { time: "13:00 - 14:20", spot: "搭乘 N'EX 特急前往機場", note: "起訖：新宿站 → 成田機場第 2 航廈。務必持 N'EX 票券提早完成回程劃位。" },
          { time: "14:20 - 16:20", spot: "成田機場第2航廈報到", note: "辦理星宇航空行李託運、通過安檢與移民局、在免稅店進行最後採購。" },
          { time: "16:20 - 19:00", spot: "飛行時間 (JX801/803)", note: "搭乘舒適星宇航空返回桃園國際機場 (TPE) 第 1 航廈。" },
          { time: "19:30 - 21:00", spot: "回程與停車場", note: "機場取車後，由桃園機場開車返回台灣童綜合停車場，平安完成東京進香團之旅！" }

      }
    };

    const data = window.TRAVEL_DATA;
    let selectedDay = data.days[0];
    let selectedCategory = "全部";
    let searchTerm = "";
    let userPosition = null;
    let showKamakuraFood = false; // 6/23 美食推薦開關

    let map;
    let placeLayer;
    let routeLayer;
    let userLayer;
    let foodLayer; // 特殊美食標點圖層

    const $ = (id) => document.getElementById(id);

    // 每一種類別對應的優雅主題色系
    const categoryColors = {
      "神社寺院": "#10b981", // 綠色
      "購物": "#f59e0b",     // 琥珀色
      "美食": "#ef4444",     // 紅色
      "老街": "#8b5cf6",     // 紫色
      "地標": "#3b82f6",     // 藍色
      "交通": "#4b5563",     // 深灰
      "海岸": "#06b6d4",     // 青色
      "海島": "#14b8a6",     // 藍綠色
      "拍照": "#ec4899",     // 粉色
      "街區": "#6366f1",     // 靛藍
      "博物館": "#6b7280"     // 灰色
    };

    function init() {
      renderDateTabs();
      initMap();
      bindEvents();
      requestLocation();
      render();

      // 強制在加載後微調地圖大小，防止行動裝置因容器渲染延遲導致地圖空白或加載不全
      setTimeout(() => {
        if (map) {
          map.invalidateSize();
        }
      }, 400);

      // 監聽視窗重設，確保手機旋轉、RWD 縮放時地圖比例與渲染正常
      window.addEventListener("resize", () => {
        if (map) {
          map.invalidateSize();
        }
      });
    }

    function initMap() {
      // 預設中心點設為第一個行程的中心
      map = L.map("map", { zoomControl: false }).setView(selectedDay.center, selectedDay.zoom);
      
      L.control.zoom({ position: "bottomright" }).addTo(map);
      
      // 使用更清晰美觀的 OpenStreetMap
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "東京進香團導航系統 © OpenStreetMap"
      }).addTo(map);

      placeLayer = L.layerGroup().addTo(map);
      routeLayer = L.layerGroup().addTo(map);
      userLayer = L.layerGroup().addTo(map);
      foodLayer = L.layerGroup().addTo(map);
    }

    function bindEvents() {
      $("locateBtn").addEventListener("click", requestLocation);
      
      $("searchInput").addEventListener("input", (event) => {
        searchTerm = event.target.value.trim().toLowerCase();
        render();
      });

      // 6/23 鎌倉特殊美食推薦標記切換
      $("toggleKamakuraFood").addEventListener("click", () => {
        showKamakuraFood = !showKamakuraFood;
        if (showKamakuraFood) {
          $("toggleKamakuraFood").textContent = "隱藏美食標點";
          $("toggleKamakuraFood").classList.replace("bg-amber-200", "bg-amber-600");
          $("toggleKamakuraFood").classList.replace("text-amber-900", "text-white");
        } else {
          $("toggleKamakuraFood").textContent = "顯示美食標點";
          $("toggleKamakuraFood").classList.replace("bg-amber-600", "bg-amber-200");
          $("toggleKamakuraFood").classList.replace("text-white", "text-amber-900");
        }
        render();
      });
    }

    function renderDateTabs() {
      $("dateTabs").innerHTML = data.days.map((day) => `
        <button class="date-tab px-4 py-2.5 rounded-xl font-bold text-xs md:text-sm whitespace-nowrap transition-all border ${
          day.id === selectedDay.id 
            ? "bg-emerald-600 border-emerald-600 text-white shadow-md shadow-emerald-600/10 scale-105" 
            : "bg-white border-gray-200 text-gray-600 hover:border-gray-300 hover:bg-gray-50"
        }" data-day="${day.id}" type="button">
          ${day.label} · ${day.title}
        </button>
      `).join("");

      document.querySelectorAll(".date-tab").forEach((button) => {
        button.addEventListener("click", () => {
          selectedDay = data.days.find((day) => day.id === button.dataset.day);
          selectedCategory = "全部";
          searchTerm = "";
          showKamakuraFood = false; // 切換天數重設美食
          
          // 狀態控制
          $("searchInput").value = "";
          $("toggleKamakuraFood").textContent = "顯示美食標點";
          $("toggleKamakuraFood").className = "text-[10px] font-black bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full hover:bg-amber-300 transition-colors";

          // 鎌倉美食看板顯示邏輯
          if (selectedDay.id === "day-0623") {
            $("kamakuraFoodPanel").classList.remove("hidden");
          } else {
            $("kamakuraFoodPanel").classList.add("hidden");
          }

          renderDateTabs();
          render();
          
          // 將視野重設為當天景點的中心點
          map.setView(selectedDay.center, selectedDay.zoom);

          // 點擊切換日期時，亦強迫地圖容器重繪大小防灰色缺片
          setTimeout(() => {
            if (map) map.invalidateSize();
          }, 150);
        });
      });
    }

    function render() {
      $("dayTitle").textContent = `${selectedDay.label} ${selectedDay.title}`;
      $("dayMeta").textContent = selectedDay.meta;
      
      renderCategoryFilters();
      const places = filteredPlaces();
      
      renderMap(places);
      renderStops(places);
      renderCards(places);
      renderTimeline();
      updateRouteLinks(places);
      
      let countText = `${places.length} 個行程停靠點`;
      if (selectedDay.id === "day-0623" && showKamakuraFood) {
        countText += ` + 4 個美食推薦點`;
      }
      $("mapCount").textContent = countText;
    }

    function categories() {
      // 動態彙整當天的類別
      return ["全部", ...new Set(selectedDay.places.map((place) => place.category))];
    }

    function renderCategoryFilters() {
      $("categoryFilters").innerHTML = categories().map((category) => `
        <button type="button" class="chip px-3 py-1.5 rounded-xl border text-[11px] font-bold transition-all ${
          category === selectedCategory 
            ? "bg-emerald-50 border-emerald-500 text-emerald-700 shadow-sm" 
            : "bg-white border-gray-200 text-gray-500 hover:border-gray-300"
        }" data-category="${category}">
          ${category}
        </button>
      `).join("");

      document.querySelectorAll(".chip").forEach((button) => {
        button.addEventListener("click", () => {
          selectedCategory = button.dataset.category;
          render();
        });
      });
    }

    function filteredPlaces() {
      return selectedDay.places.filter((place) => {
        const matchCategory = selectedCategory === "全部" || place.category === selectedCategory;
        const text = `${place.name} ${place.area} ${place.category} ${place.note} ${place.time}`.toLowerCase();
        return matchCategory && (!searchTerm || text.includes(searchTerm));
      });
    }

    // 順序標記 HTML（美化版，包含序列號與時間字串）
    function markerHtml(place, index, isFood = false) {
      const color = isFood ? "#d97706" : (categoryColors[place.category] || "#10b981");
      const numOrIcon = isFood ? "🍛" : (index + 1);
      return `
        <div style="position: relative; display: flex; flex-direction: column; align-items: center;">
          <!-- 泡泡型順序編號 -->
          <div style="width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: ${color}; color: white; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.15); font-weight: 800; font-size: 13px;">
            ${numOrIcon}
          </div>
          <!-- 小箭頭下標 -->
          <div style="width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid ${color}; margin-top: -1px;"></div>
        </div>
      `;
    }

    function renderMap(places) {
      placeLayer.clearLayers();
      routeLayer.clearLayers();
      foodLayer.clearLayers();

      const bounds = [];
      
      // 1. 繪製並標記標準行程景點 (嚴格按照陣列中的時間順序)
      places.forEach((place, index) => {
        const marker = L.marker([place.lat, place.lng], {
          icon: L.divIcon({ className: "", html: markerHtml(place, index), iconSize: [32, 40], iconAnchor: [16, 40] })
        }).addTo(placeLayer);

        marker.bindPopup(`
          <div style="font-family: sans-serif; line-height: 1.4; max-width: 220px;">
            <div style="display: flex; items-center; justify-content: space-between; margin-bottom: 4px;">
              <span style="background: #e0f2fe; color: #0369a1; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px;">第 ${index + 1} 站</span>
              <strong style="color: #047857; font-size: 11px;">⏱️ ${place.time}</strong>
            </div>
            <strong style="font-size: 14px; color: #111827; display: block; margin-top: 4px;">${place.name}</strong>
            <span style="color: #6b7280; font-size: 11px;">${place.area} · ${place.category}</span>
            <p style="color: #374151; font-size: 11.5px; margin: 6px 0; padding-top: 4px; border-top: 1px solid #f3f4f6;">${place.note}</p>
            <a target="_blank" rel="noreferrer" href="${googleMapsPlaceUrl(place)}" style="display: block; text-align: center; background: #059669; color: white; border-radius: 6px; text-decoration: none; padding: 6px 8px; font-size: 11px; font-weight: bold; margin-top: 6px;">
              Google 導航此站
            </a>
          </div>
        `);
        bounds.push([place.lat, place.lng]);
      });

      // 2. 繪製動態流光虛線路徑 (連接順序 1 -> 2 -> 3)
      if (places.length > 1) {
        const latlngs = places.map((place) => [place.lat, place.lng]);
        L.polyline(latlngs, {
          color: "#10b981", // 主題綠色
          weight: 4,
          opacity: 0.85,
        }).addTo(routeLayer);
      }

      // 3. 特殊處理：6/23 顯示四大午餐美食推薦
      if (selectedDay.id === "day-0623" && showKamakuraFood) {
        data.kamakuraFood.forEach((food) => {
          const foodMarker = L.marker([food.lat, food.lng], {
            icon: L.divIcon({ className: "", html: markerHtml(food, 0, true), iconSize: [32, 40], iconAnchor: [16, 40] })
          }).addTo(foodLayer);

          foodMarker.bindPopup(`
            <div style="font-family: sans-serif; line-height: 1.4; max-width: 200px;">
              <span style="background: #fef3c7; color: #92400e; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px;">🍽️ 鎌倉美食推薦</span>
              <strong style="font-size: 14px; color: #111827; display: block; margin-top: 4px;">${food.name}</strong>
              <p style="color: #374151; font-size: 11.5px; margin: 4px 0;">${food.note}</p>
              <a target="_blank" rel="noreferrer" href="${googleMapsPlaceUrl(food)}" style="display: block; text-align: center; background: #d97706; color: white; border-radius: 6px; text-decoration: none; padding: 5px 8px; font-size: 11px; font-weight: bold; margin-top: 4px;">
                地圖導航名店
              </a>
            </div>
          `);
          bounds.push([food.lat, food.lng]);
        });
      }

      // 4. 定位處理
      if (userPosition) bounds.push([userPosition.lat, userPosition.lng]);
      if (bounds.length) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: selectedDay.zoom });
      } else {
        map.setView(selectedDay.center, selectedDay.zoom);
      }
    }

    // 渲染停靠景點卡片（左側）
    function renderStops(places) {
      if (!places.length) {
        $("stopList").innerHTML = `
          <div class="text-center py-8 px-4 border-2 border-dashed border-gray-200 rounded-2xl bg-gray-50">
            <span class="text-3xl">🧩</span>
            <strong class="block text-gray-700 text-sm mt-2">查無景點項目</strong>
            <span class="text-xs text-gray-400 block mt-1">試著切換過濾器或重新輸入搜尋字詞</span>
          </div>
        `;
        return;
      }

      $("stopList").innerHTML = places.map((place, index) => {
        const color = categoryColors[place.category] || "#10b981";
        return `
          <div class="group flex items-start gap-3 p-3 bg-white border border-gray-100 rounded-xl hover:border-gray-200 hover:shadow-sm cursor-pointer transition-all" onclick="focusOnMap(${place.lat}, ${place.lng}, 16)">
            <!-- 序號泡泡 -->
            <div class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center font-extrabold text-xs text-white" style="background: ${color};">
              ${index + 1}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-1.5">
                <h4 class="font-bold text-xs text-gray-900 group-hover:text-emerald-700 transition-colors truncate">${place.name}</h4>
                <span class="text-[10px] text-gray-400 font-extrabold flex-shrink-0 bg-gray-100 px-1.5 py-0.5 rounded">${place.time}</span>
              </div>
              <p class="text-[10px] text-gray-500 mt-1 line-clamp-1">${place.note}</p>
            </div>
          </div>
        `;
      }).join("");
    }

    // 輔助函式：點擊景點卡片，地圖視角平滑位移至目標點
    window.focusOnMap = function(lat, lng, zoomLevel = 17) {
      map.setView([lat, lng], zoomLevel);
      // 移動至頂端
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    // 渲染右下角景點導覽卡片
    function renderCards(places) {
      if (!places.length) {
        $("placeCards").innerHTML = `
          <div class="col-span-full py-8 text-center text-gray-400 text-xs">
            目前過濾條件下無景點導覽卡片。
          </div>
        `;
        return;
      }

      $("placeCards").innerHTML = places.map((place, index) => {
        const color = categoryColors[place.category] || "#10b981";
        return `
          <article class="bg-white border border-gray-100 hover:border-gray-200 rounded-2xl shadow-sm hover:shadow p-4 flex flex-col justify-between transition-all">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-extrabold text-white px-2 py-0.5 rounded-md" style="background: ${color};">
                  ${place.category}
                </span>
                <span class="text-xs text-gray-400 font-extrabold">第 ${index + 1} 站 · ${place.time}</span>
              </div>
              <h3 class="font-black text-gray-900 text-sm mb-1.5">${place.name}</h3>
              <p class="text-xs text-gray-500 leading-relaxed mb-4">${place.note}</p>
            </div>
            
            <div class="grid grid-cols-2 gap-2 pt-3 border-t border-gray-100">
              <button onclick="focusOnMap(${place.lat}, ${place.lng}, 17)" class="text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 py-2 rounded-xl transition-all text-center">
                地圖定位
              </button>
              <a target="_blank" rel="noreferrer" href="${googleMapsPlaceUrl(place)}" class="text-xs font-bold text-sky-700 bg-sky-50 hover:bg-sky-100 py-2 rounded-xl transition-all text-center">
                開啟導航
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    // 渲染下方的時間線流程圖 (最細部時間表)
    function renderTimeline() {
      const timeline = data.itineraries?.[selectedDay.id] || [];
      $("timelineTitle").textContent = `${selectedDay.label} · 行程詳細時間表`;
      $("timelineMeta").textContent = timeline.length ? `${timeline.length} 個行程節點` : "未設定流程";

      if (!timeline.length) {
        $("timelineRows").innerHTML = `
          <div class="text-center py-6 text-gray-400 text-xs">
            本日期無精細時間流程表。
          </div>
        `;
        return;
      }

      $("timelineRows").innerHTML = timeline.map((item) => `
        <article class="flex items-start gap-4">
          <!-- 時間與原點 -->
          <div class="flex flex-col items-center">
            <span class="text-xs font-extrabold text-emerald-600 bg-emerald-50 border border-emerald-200/50 px-2 py-1 rounded-md whitespace-nowrap">
              ${item.time}
            </span>
            <div class="w-0.5 h-full bg-emerald-100 min-h-[30px] my-1"></div>
          </div>
          <!-- 詳細內容 -->
          <div class="bg-gray-50/50 hover:bg-gray-50 border border-gray-100 rounded-xl p-3 flex-1 transition-colors">
            <h4 class="font-black text-gray-900 text-xs md:text-sm">${item.spot}</h4>
            <p class="text-[11px] md:text-xs text-gray-500 mt-1 leading-relaxed">${item.note}</p>
          </div>
        </article>
      `).join("");
    }

    function updateRouteLinks(places) {
      $("googleRouteLink").href = googleMapsRouteUrl(places);
      const nearest = nearestPlace(places);
      $("nearestRouteLink").href = nearest ? googleMapsPlaceUrl(nearest) : googleMapsRouteUrl(places);
      $("nearestRouteLink").textContent = nearest ? `導航至最近站：${nearest.name}` : "導航到最近景點";
    }

    // 地理定位處理
    function requestLocation() {
      if (!navigator.geolocation) {
        $("locationStatus").innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> 瀏覽器不支援定位`;
        return;
      }
      $("locationStatus").innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> 正在定位中...`;
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userPosition = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          $("locationStatus").innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 本地位置已同步`;
          drawUserPosition();
          render();
        },
        () => {
          $("locationStatus").innerHTML = `<span class="w-2 h-2 rounded-full bg-gray-300"></span> 定位授權未開啟`;
          drawUserPosition();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
      );
    }

    function drawUserPosition() {
      userLayer.clearLayers();
      if (!userPosition) return;
      L.marker([userPosition.lat, userPosition.lng], {
        icon: L.divIcon({ className: "", html: "<div class='user-marker-pulse'></div>", iconSize: [14, 14], iconAnchor: [7, 7] })
      }).addTo(userLayer).bindPopup("<b>這是你的目前位置</b><br>系統將以此計算最近的景點。");
    }

    // 計算距離最近的景點
    function nearestPlace(places) {
      if (!userPosition || !places.length) return null;
      return [...places].sort((a, b) => distance(userPosition, a) - distance(userPosition, b))[0];
    }

    // 哈維辛公式（計算經緯度距離公里數）
    function distance(a, b) {
      const rad = Math.PI / 180;
      const lat1 = a.lat * rad;
      const lat2 = b.lat * rad;
      const dLat = (b.lat - a.lat) * rad;
      const dLng = (b.lng - a.lng) * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
      return 6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }

    // 生成單一景點導航網址
    function googleMapsPlaceUrl(place) {
      const origin = userPosition ? `&origin=${userPosition.lat},${userPosition.lng}` : "";
      return `https://www.google.com/maps/dir/?api=1${origin}&destination=${place.lat},${place.lng}&travelmode=${selectedDay.routeMode}`;
    }

    // 生成全天多點依序連貫導航網址 (精華，依陣列時間順序)
    function googleMapsRouteUrl(places) {
      if (!places.length) return "https://www.google.com/maps";
      const origin = userPosition ? `${userPosition.lat},${userPosition.lng}` : `${places[0].lat},${places[0].lng}`;
      const destination = places[places.length - 1];
      const waypoints = places.slice(0, -1).map((place) => `${place.lat},${place.lng}`).join("|");
      return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination.lat},${destination.lng}&waypoints=${encodeURIComponent(waypoints)}&travelmode=${selectedDay.routeMode}`;
    }

    window.onload = function() {
      init();
    };
  </script>
</body>
</html>
